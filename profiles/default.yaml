# An alias for `ai`, so `aes setup` with no --profile does the obvious thing.
# Both files exist so the name a user is likely to type works.
name: default
description: Alias for the ai profile — a verified AI coding environment
tags:
  - terminal
  - ai
# No include list on purpose. A profile's tags SELECT (Resolve unions them
# with include, matching by category OR tag), so naming seven tools here
# and then tagging the profile `terminal, ai` selects the same thing twice
# and the two lists drift apart the first time a tool is added to a tag.
#
# gemini is NOT excluded any more, and the reason it does not need to be is
# worth keeping. It was excluded because its npm package declares
# `engines: node >=20` while ubuntu:24.04 ships node 18.19.1, so it installed
# and then died with "SyntaxError: Invalid regular expression flags". Excluding
# it hid the real shape of the problem: a single version coordinate for two
# platforms that need different ones. The linux target of the gemini manifest
# now pins the version that actually runs on node 18, and darwin keeps the
# current one for brew's node 26 — so the exception lived where the fact lives,
# in the manifest, instead of in a profile that had to name it again.
#
# The exclude block stayed in place after the fix on 2026-09-28 for a day,
# which is exactly the failure a tag-omission causes: nothing in the run
# suggested the profile was quietly smaller than the tag says.
require_tested: true
