# AES catalog. Package names verified against the Debian package index.
#
# Debian ships the Kubernetes client as `kubernetes-client`, not `kubectl`.
# The obvious name does not exist there, so an install keyed on it fails.
name: kubectl
description: Kubernetes command-line client
category: infra
tested: false
tags:
  - infra
  - kubernetes
verify:
  command: kubectl
  version:
    command: kubectl version --client
    min: "1.28"
install:
  darwin:
    strategy: package
    manager: brew
    package: kubernetes-cli
  linux:
    strategy: package
    manager: apt
    package: kubernetes-client
