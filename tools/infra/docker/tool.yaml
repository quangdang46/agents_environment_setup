name: docker
description: container runtime and CLI
category: infra
default: true
tested: true
tested_on:
- linux/arm64
- linux/amd64
- darwin/arm64
tags:
- infra
provides:
- docker
verify:
  command: docker
  version:
    command: docker --version
    min: '24.0'
install:
  darwin:
    strategy: package
    manager: brew
    package: docker
  linux:
    strategy: package
    manager: apt
    package: docker.io
