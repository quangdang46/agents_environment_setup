name: postgres18
description: PostgreSQL 18 relational database server and client
category: infra
tested: false
tags:
- infra
- database
verify:
  command: psql
  version:
    command: psql --version
    min: '18'
install:
  darwin:
    strategy: package
    manager: brew
    package: postgresql@18
  linux:
    strategy: package
    manager: apt
    package: postgresql-18
    apt_source:
      url: https://apt.postgresql.org/pub/repos/apt noble-pgdg main
      keyring_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
      keyring_sha256: 0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76
