name: postgres18
dependencies:
  # gnupg is not optional for these three. A declared apt source
  # publishes its key in the armored form, and apt's signed-by= needs
  # the binary form, so the installer shells out to gpg to convert it.
  # Without it the keyring is written armored, apt reports NO_PUBKEY
  # for a key that is sitting in the file, and the message points at
  # the key rather than at the format. Measured 2026-09-30 in a clean
  # ubuntu:24.04 with only ca-certificates, curl and git.
  - gnupg

description: PostgreSQL 18 relational database server and client
category: infra
tested: true
# Layer 1 and Layer 2 both passed on linux/amd64, 2026-09-30. What the
# flag means, and why there is no darwin/* entry, is in AGENTS.md under
# "tested: true".
tested_on:
  - linux/amd64
tags:
- infra
- database
verify:
  command: psql
  version:
    command: psql --version
    min: '18'
install:
  darwin:
    strategy: package
    manager: brew
    package: postgresql@18
  linux:
    strategy: package
    manager: apt
    package: postgresql-18
    apt_source:
      url: https://apt.postgresql.org/pub/repos/apt noble-pgdg main
      keyring_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
      keyring_sha256: 0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76
