# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: git
description: distributed version control system
category: git
# Both layers passed on the platform named below: aes installed this from
# nothing in a fresh container, and `aes verify` reported StatusOK with a
# parsed version on that same machine afterwards (bead gj9). `tested_on`
# is load-bearing rather than decorative — require_tested reads it, so the
# resolver skips this on a host it was never proven on.
tested: true
tested_on:
  - linux/arm64
  # Layer 1: a real machine carrying git 2.53.0. Layer 2: a fresh
  # ubuntu:24.04 container, where the distro index supplies git 2.43.0 and
  # `aes verify` reports StatusOK. Both measured 2026-09-29 during the
  # full-catalog run. Without this the only catalog entry a full-profile run
  # never touched: I15 skips a tool unproven on the host, and this was the
  # one still carrying only the arm64 proof.
  - linux/amd64
tags:
  - git
verify:
  command: git
  version:
    command: git --version
    min: "2.30"
install:
  darwin:
    strategy: package
    manager: brew
    package: git
  linux:
    strategy: package
    manager: apt
    package: git
