# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: fmd
description: markdown tooling for agent documents
category: agent
tested: false
tags:
  - agent
  - docs
verify:
  command: fmd
  version:
    command: fmd --version
    min: "0.4.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: fmd
  linux:
    strategy: package
    manager: apt
    package: fmd
