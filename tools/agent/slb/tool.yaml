# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: slb
description: launches many agent sessions at once
category: agent
tested: false
tags:
  - agent
verify:
  command: slb
  version:
    command: slb --version
    min: "0.5.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: slb
  linux:
    strategy: package
    manager: apt
    package: slb
