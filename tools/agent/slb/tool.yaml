# AES catalog. github-release for darwin, linux at Dicklesworthstone/simultaneous_launch_button release v0.5.2;
# asset names and sha256 read from the upstream release by scripts/release_probe.py.
#
# This was `package`/apt until an audit found the package name does not exist in
# Debian. The first check that said it did was reading an HTTP 200 from a page
# whose body said 'No such package' - a check that could not fail.
name: slb
description: launches many agent sessions at once
category: agent
tested: false
tags:
  - agent
verify:
  command: slb
  version:
    # `slb version`, not `slb --version`. The dashed spelling is rejected with
    # "Error: unknown flag: --version" and exits 0, so the probe printed no
    # version and the tool reported as unknown on a machine where it works.
    # Measured by running the binary from the release archive.
    command: slb version
    min: "0.5.0"
install:
  darwin:
    strategy: github-release
    release_tag: v0.5.2
    repository: Dicklesworthstone/simultaneous_launch_button
    asset:
      amd64: slb_0.5.2_darwin_amd64.tar.gz
      arm64: slb_0.5.2_darwin_arm64.tar.gz
    sha256:
      amd64: 23ae548fc44b8a4df3aa9c0dd72151316443051252152864e18e9c42d20c21bc
      arm64: e6e425605df4ea01fef10c701a139d282613aab22a3a7f49e8e5eb32d6e2f933
  linux:
    strategy: github-release
    release_tag: v0.5.2
    repository: Dicklesworthstone/simultaneous_launch_button
    asset:
      amd64: slb_0.5.2_linux_amd64.tar.gz
      arm64: slb_0.5.2_linux_arm64.tar.gz
    sha256:
      amd64: 18ff0daf113d2432538e46f3ad21c41a97c8891966da4febcf18d717a5b826ed
      arm64: ff315e57f1c43ebc1acfb7cc26c1cfe8c6b2157300f77f5478c4c6ce59ba4967
