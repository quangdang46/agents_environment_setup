# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: casr
description: resumes a session under a different agent
category: agent
tested: false
tags:
  - agent
verify:
  command: casr
  version:
    command: casr --version
    min: "0.3.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: casr
  linux:
    strategy: package
    manager: apt
    package: casr
