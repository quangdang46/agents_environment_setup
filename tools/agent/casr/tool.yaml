# AES catalog. github-release for darwin, linux at Dicklesworthstone/cross_agent_session_resumer release v0.4.1;
# asset names and sha256 read from the upstream release by scripts/release_probe.py.
#
# This was `package`/apt until an audit found the package name does not exist in
# Debian. The first check that said it did was reading an HTTP 200 from a page
# whose body said 'No such package' - a check that could not fail.
#
# release_tag is `v0.4.1`, not `0.4.1`, and the `v` is load-bearing: the tag is
# interpolated verbatim into the releases/download URL (installer.assetURL), so
# the unversioned form 404s and the tool reports as missing with no hint that
# the manifest is what is wrong. Measured 2026-09-29: download/0.4.1/... ->
# 404, download/v0.4.1/... -> 200. The asset NAMES are unversioned and stay as
# they are; only the tag carries the prefix.
name: casr
description: resumes a session under a different agent
category: agent
tested: true
# Layer 1 and Layer 2 both passed on linux/amd64, 2026-09-30. What the
# flag means, and why there is no darwin/* entry, is in AGENTS.md under
# "tested: true".
tested_on:
  - linux/amd64
tags:
  - agent
verify:
  command: casr
  version:
    command: casr --version
    min: "0.3.0"
install:
  darwin:
    strategy: github-release
    release_tag: v0.4.1
    repository: Dicklesworthstone/cross_agent_session_resumer
    asset:
      amd64: casr-x86_64-apple-darwin.tar.xz
      arm64: casr-aarch64-apple-darwin.tar.xz
    sha256:
      amd64: fa6e4169e1d92d2ef4109e6e4aa65510668fb2628de18c8e7e1d84cc51bdb9bf
      arm64: 88ed7cd5c575a9eb78e33b5fcee6dd5d8103797aef0fc8477e18fea1168493d0
  linux:
    strategy: github-release
    release_tag: v0.4.1
    repository: Dicklesworthstone/cross_agent_session_resumer
    asset:
      amd64: casr-x86_64-unknown-linux-musl.tar.xz
      arm64: casr-aarch64-unknown-linux-musl.tar.xz
    sha256:
      amd64: 616c619f2efacbcc18729ab3d5fbc94135c2cc2844249e4a63164c21ea28972f
      arm64: 20ca73784179628d3b7e90af3f3fe3f0454a83837614e6707364a2744ab45bea
