# AES catalog. github-release for darwin, linux at Dicklesworthstone/cross_agent_session_resumer release v0.4.1;
# asset names and sha256 read from the upstream release by scripts/release_probe.py.
#
# This was `package`/apt until an audit found the package name does not exist in
# Debian. The first check that said it did was reading an HTTP 200 from a page
# whose body said 'No such package' - a check that could not fail.
name: casr
description: resumes a session under a different agent
category: agent
tested: false
tags:
  - agent
verify:
  command: casr
  version:
    command: casr --version
    min: "0.3.0"
install:
  darwin:
    strategy: github-release
    repository: Dicklesworthstone/cross_agent_session_resumer
    asset:
      amd64: casr-x86_64-apple-darwin.tar.xz
      arm64: casr-aarch64-apple-darwin.tar.xz
    sha256:
      amd64: fa6e4169e1d92d2ef4109e6e4aa65510668fb2628de18c8e7e1d84cc51bdb9bf
      arm64: 88ed7cd5c575a9eb78e33b5fcee6dd5d8103797aef0fc8477e18fea1168493d0
  linux:
