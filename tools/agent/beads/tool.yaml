# AES catalog. Ecosystem coordinate ownership verified: Dicklesworthstone (verified via crates.io /owners). A crate's repository field is self-declared, so the owners endpoint is the only real check. The obvious names in this set are taken by other people on crates.io and npm, so the obvious registry is the wrong one.
name: beads
description: graph-aware issue tracker for AI agents
category: agent
tested: false
tags:
  - agent
  - issues
dependencies:
  - rust
verify:
  command: br
  version:
    command: br --version
    min: "0.1.0"
install:
  darwin:
    strategy: cargo
    cargo_name: beads_rust@0.7.0
  linux:
    strategy: cargo
    cargo_name: beads_rust@0.7.0
