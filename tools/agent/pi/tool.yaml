# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: pi
description: pi agent runtime
category: agent
tested: false
tags:
  - agent
verify:
  command: pi
  version:
    command: pi --version
    min: "0.6.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: pi
  linux:
    strategy: package
    manager: apt
    package: pi
