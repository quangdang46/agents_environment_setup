name: pi
description: pi agent runtime
category: agent
tested: true
tested_on:
- linux/arm64
- linux/amd64
tags:
- agent
verify:
  command: pi
  version:
    command: pi --version
    min: 0.6.0
install:
  darwin:
    strategy: package
    manager: brew
    package: pi
  linux:
    strategy: package
    manager: apt
    package: pi
