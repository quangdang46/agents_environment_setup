# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: caam
description: manages coding agent accounts
category: agent
tested: false
tags:
  - agent
verify:
  command: caam
  version:
    command: caam --version
    min: "0.1.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: caam
  linux:
    strategy: package
    manager: apt
    package: caam
