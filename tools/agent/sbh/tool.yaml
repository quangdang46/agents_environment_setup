# AES catalog. github-release for darwin, linux at
# Dicklesworthstone/storage_ballast_helper release v0.6.14; asset names and
# sha256 read from the upstream release by scripts/release_probe.py.
#
# This was `package`/apt until an audit found the package name does not exist in
# Debian. The first check that said it did was reading an HTTP 200 from a page
# whose body said 'No such package' - a check that could not fail.
#
# Two deliberate pin rules:
#
# 1. The linux asset is `sbh-x86_64-...` with NO version in the name, while
#    darwin is `sbh-aarch64-apple-darwin.tar.xz`. The versioned name fails with
#    404 on every run because `releases/latest` always moves to the newest tag.
#    A checksum in a manifest that names an asset which does not exist is a
#    better failure than a stale one, but only if the wrong name is caught.
# 2. The sha256 is pinned to v0.6.14 (not v0.6.12). The old pin failed because
#    `releases/latest` had moved on, so the bytes no longer matched. A
#    checksum protects integrity, not staleness: it proves the bytes are what
#    someone recorded once, and says nothing about whether they are current.
#    Every hash here was re-fetched from the tagged release and re-verified.
name: sbh
description: disk-pressure defence for agent workloads
category: agent
tested: false
tags:
  - agent
  - system
verify:
  command: sbh
  version:
    command: sbh --version
    min: "0.6.0"
install:
  darwin:
    strategy: github-release
    repository: Dicklesworthstone/storage_ballast_helper
    asset:
      amd64: sbh-x86_64-apple-darwin.tar.xz
      arm64: sbh-aarch64-apple-darwin.tar.xz
    sha256:
      amd64: e6006dc12b2bbe65ef660ae1d1ba44cf6e0d3793ea16cb16d0027e9aaa46be01
      arm64: 0f37bbf3a8837816e1e9e08df2828bc12963b554ee0e911f7328f38de10ee7f2
  linux:
    strategy: github-release
    repository: Dicklesworthstone/storage_ballast_helper
    asset:
      # Unversioned name — see note 2 above.
      amd64: sbh-x86_64-unknown-linux-gnu.tar.xz
      arm64: sbh-aarch64-unknown-linux-gnu.tar.xz
    sha256:
      amd64: df446dbd2cde939d9caae552dc49aa5fc3c996d953fdc767ee3bf622b49b064f
      arm64: 7392776a454f47925ec5f1e491a8da11d3ecd7d166f9a7f2bb92c3ca5499fca1
