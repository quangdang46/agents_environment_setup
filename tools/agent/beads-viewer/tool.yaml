# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: beads-viewer
description: TUI for the beads task graph
category: agent
tested: false
tags:
  - agent
  - issues
verify:
  command: beads-viewer
  version:
    command: bv --version
    min: "0.16.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: beads-viewer
  linux:
    strategy: package
    manager: apt
    package: bv
