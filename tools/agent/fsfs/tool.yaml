# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: fsfs
description: full-disk search for agent work
category: agent
tested: false
tags:
  - agent
  - search
verify:
  command: fsfs
  version:
    command: fsfs --version
    min: "1.10.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: fsfs
  linux:
    strategy: package
    manager: apt
    package: fsfs
