# AES catalog. github-release for darwin, linux at Dicklesworthstone/frankensearch release v1.10.0;
# asset names and sha256 read from the upstream release by scripts/release_probe.py.
#
# This was `package`/apt until an audit found the package name does not exist in
# Debian. The first check that said it did was reading an HTTP 200 from a page
# whose body said 'No such package' - a check that could not fail.
name: fsfs
description: full-disk search for agent work
category: agent
tested: false
tags:
  - agent
  - search
verify:
  command: fsfs
  version:
    # `fsfs version`, not `fsfs --version`. The dashed spelling prints a JSON
    # error object — {"ok":false,"error":{"code":"invalid_config", ...}} — and
    # exits 0, so a probe that cannot read a version looks exactly like one
    # that succeeded. Measured by running the binary from the release archive.
    command: fsfs version
    min: "1.10.0"
install:
  darwin:
    strategy: github-release
    release_tag: v1.10.0
    repository: Dicklesworthstone/frankensearch
    asset:
      amd64: fsfs-lite-1.10.0-x86_64-apple-darwin.tar.xz
      arm64: fsfs-1.10.0-aarch64-apple-darwin.tar.xz
    sha256:
      amd64: 98805f3fa04aaeec25a70e276fd068de45e74191519e79def07c11bbc3246610
      arm64: fd86d12e5ab8794d930715e5dd59b3445d1789717d31f902cf95135f4bf2f18f
  linux:
    strategy: github-release
    release_tag: v1.10.0
    repository: Dicklesworthstone/frankensearch
    asset:
      # musl, not gnu. The gnu build links against GLIBC 2.43 and dies on
      # ubuntu 24.04, which ships 2.39: "/lib/x86_64-linux-gnu/libm.so.6:
      # version `GLIBC_2.43' not found". Measured in a fresh container during
      # the full-catalog run — the binary installs cleanly and then will not
      # start, which is the worst shape for a tool. The musl build is static
      # and ships the same `fsfs` binary inside the archive.
      amd64: fsfs-lite-1.10.0-x86_64-unknown-linux-musl.tar.xz
      arm64: fsfs-lite-1.10.0-aarch64-unknown-linux-musl.tar.xz
    sha256:
      amd64: fa1b1adc3f830eb99bff54c5c887fd3ce056fc5af9ac893bb3f0b8c87bb263f2
      arm64: a014c589293006deb8fbd21f8ed962a86f8aa8afe0ca422378d4a345260ec8fb
