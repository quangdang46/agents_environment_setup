# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: ee
description: eidetic engine command line
category: agent
tested: false
tags:
  - agent
verify:
  command: ee
  version:
    command: ee --version
    min: "0.15.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: ee
  linux:
    strategy: package
    manager: apt
    package: ee
