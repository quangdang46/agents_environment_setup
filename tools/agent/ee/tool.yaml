# AES catalog. github-release for darwin, linux at Dicklesworthstone/eidetic_engine_cli release v0.16.0
# (tag resolved from the GitHub API, not parsed out of an asset filename).
#
# Re-measured 2026-09-29. The two darwin digests below were v0.15.2's: the tag had been bumped to
# v0.16.0 but the darwin hashes were not re-read, so on any Mac `aes setup` downloaded v0.16.0 and
# failed with ErrChecksum. Replaced by digests of the v0.16.0 assets computed locally with
# `sha256sum` after a full download; all four agree byte-for-byte with the release's own per-asset
# .sha256 sidecars and with its SHA256SUMS. The linux pair was already correct and was left alone.
# The file header previously said v0.15.2 while the body pinned v0.16.0 - the comment was stale too.
#
# Archive contents: each of the four .tar.xz holds exactly one file, `ee`, so the installed binary
# name equals the tool name and no `binary:` override is needed.
# Version probe, run against the extracted v0.16.0 linux/amd64 binary: `ee --version` prints
# `ee 0.16.0`, exit 0, 10 bytes on stdout and nothing on stderr.
#
# This was `package`/apt until an audit found the package name does not exist in
# Debian. The first check that said it did was reading an HTTP 200 from a page
# whose body said 'No such package' - a check that could not fail.
name: ee
description: eidetic engine command line
category: agent
tested: true
# Layer 1 and Layer 2 both passed on linux/amd64, 2026-09-30. What the
# flag means, and why there is no darwin/* entry, is in AGENTS.md under
# "tested: true".
tested_on:
  - linux/amd64
tags:
  - agent
verify:
  command: ee
  version:
    command: ee --version
    min: "0.15.0"
install:
  darwin:
    strategy: github-release
    release_tag: v0.16.0
    repository: Dicklesworthstone/eidetic_engine_cli
    asset:
      amd64: ee-x86_64-apple-darwin.tar.xz
      arm64: ee-aarch64-apple-darwin.tar.xz
    sha256:
      amd64: d4ba6f3ddbfda84429f4c280c3743bafd9c1ad7bcd50a83af604eb71b80bfb29
      arm64: 00352f783b3bd07f0fcded9278bf9d50cda0c5267bd0b7ac7bdfea941787e1a2
  linux:
    strategy: github-release
    release_tag: v0.16.0
    repository: Dicklesworthstone/eidetic_engine_cli
    asset:
      amd64: ee-x86_64-unknown-linux-gnu.tar.xz
      arm64: ee-aarch64-unknown-linux-gnu.tar.xz
    sha256:
      amd64: 0b3aeb194a491f7dd85d1cf67a205a57fb696120a1e17a5ad4bded7ece7b52d5
      arm64: 7d3c5b0b4fd677f649dc4100248adf9ef763c693f66af45699c16475133e4d18
