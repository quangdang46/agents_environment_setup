# AES catalog.
name: opencode
description: opencode terminal agent
category: ai
tested: true
tested_on:
  # Proven on linux/amd64 on 2026-09-27: installed from nothing in a fresh
  # ubuntu:24.04 container and `aes verify` reported StatusOK with a parsed
  # version (opencode 1.18.32) on that machine afterwards (bead gj9).
  - linux/amd64
tags:
  - ai
dependencies:
  - node
  # npm is a separate tool, not something node provides: on Ubuntu 24.04
  # `apt install nodejs` installs node and NOT npm. Measured 2026-09-28 in
  # a fresh container. Without this, claude/codex/opencode fail with
  # "strategy npm requires npm on PATH" while aes reports node as present.
  - npm
verify:
  command: opencode
  version:
    command: opencode --version
    min: "1.0"
install:
  darwin:
    strategy: npm
    npm_package: opencode-ai@1.18.32
  linux:
    strategy: npm
    npm_package: opencode-ai@1.18.32
