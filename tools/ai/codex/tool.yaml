# AES catalog.
name: codex
description: OpenAI Codex CLI
category: ai
tested: true
tested_on:
  # Proven on linux/amd64 on 2026-09-27: installed from nothing in a fresh
  # ubuntu:24.04 container and `aes verify` reported StatusOK with a parsed
  # version (codex 0.157.1) on that machine afterwards (bead gj9).
  - linux/amd64
# Same contract as claude: the whole command here, verified in
# `codex --help`, and the dangerous flag is the user's explicit choice,
# recorded rather than hidden.
aliases:
  cod: codex --dangerously-bypass-approvals-and-sandbox
tags:
  - ai
dependencies:
  - node
  # npm is a separate tool, not something node provides: on Ubuntu 24.04
  # `apt install nodejs` installs node and NOT npm. Measured 2026-09-28 in
  # a fresh container. Without this, claude/codex/opencode fail with
  # "strategy npm requires npm on PATH" while aes reports node as present.
  - npm
verify:
  command: codex
  version:
    command: codex --version
    min: "0.1.0"
install:
  darwin:
    strategy: npm
    npm_package: "@openai/codex@0.157.1"
  linux:
    strategy: npm
    npm_package: "@openai/codex@0.157.1"
