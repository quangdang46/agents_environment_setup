name: antigravity
description: Antigravity CLI (Google)
category: ai
# Proven on linux/amd64 on 2026-09-29: installed from nothing in a fresh
# ubuntu:24.04 container and `aes verify` reported StatusOK with a parsed
# version (antigravity 1.2.12) on that machine afterwards (bead gj9).
tested: true
tested_on:
  - linux/amd64
tags:
  - ai
verify:
  command: antigravity
  version:
    command: antigravity --version
    min: "1.0"
install:
  darwin:
    strategy: github-release
    release_tag: 1.2.12
    repository: google-antigravity/antigravity-cli
    asset:
      amd64: agy_cli_mac_x64.tar.gz
      arm64: agy_cli_mac_arm64.tar.gz
    sha256:
      amd64: 1e2f8ed29c05051c61015041d82a50bd95f754c19c8cc7fa8fe35b9f66c9a075
      arm64: 076a1f0a1874a2843862af9d0eeae751775a84e736e35a84de0dd268069c28cb
  linux:
    strategy: github-release
    release_tag: 1.2.12
    repository: google-antigravity/antigravity-cli
    asset:
      amd64: agy_cli_linux_x64.tar.gz
      arm64: agy_cli_linux_arm64.tar.gz
    sha256:
      amd64: 26c7c4c661d6c9beda734fcf305031056a6ea46e697c4533e8151179724e2950
      arm64: bd338c9d19ab963d9d2bc027e4e797b470ea84bae02080e4fde4555357ea9444
