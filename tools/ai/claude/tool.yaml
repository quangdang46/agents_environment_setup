# AES catalog.
name: claude
description: Claude Code, Anthropic's agentic coding tool
category: ai
# Both layers passed on the platform named below: aes installed this from
# nothing in a fresh container, and `aes verify` reported StatusOK with a
# parsed version on that same machine afterwards (bead gj9). `tested_on`
# is load-bearing rather than decorative — require_tested reads it, so the
# resolver skips this on a host it was never proven on.
tested: true
tested_on:
  - linux/arm64
  # Proven on amd64 by the same sequence, on 2026-09-27: installed from
  # nothing in a fresh ubuntu:24.04 container and `aes verify` reported StatusOK
  # with a parsed version (2.1.283) on that machine. The run needed
  # --allow-unproven, because a tool proven only on arm64 is skipped on amd64
  # (I15) — the run that gathers a platform's evidence has to be allowed to
  # install the tool whose evidence is missing.
  - linux/amd64
# claude-code is the shortcut a fresh shell gets for Claude Code. The value
# is the whole command, declared here rather than in a hand-written zshrc,
# because a generated file cannot disagree with what declared it.
#
# The name is NOT `cc`, and that is a correction rather than a preference.
# `cc` is the C compiler on every Unix — /usr/bin/cc is a symlink into
# /etc/alternatives — and aliasing over it means a user who types `cc` to
# compile something gets an agent instead. ACFS ships `cc` and has the same
# collision; it is the bug their own zshrc carries an `unalias br` guard for,
# and it is the class of mistake this schema exists to prevent. A shortcut
# that shadows a system binary is not a shortcut.
#
# --dangerously-skip-permissions is present on purpose, and it is not a default
# an environment manager should take silently: it bypasses every permission
# check in the agent. The user asked for the ACFS behaviour, it is verified to
# exist in `claude --help` on this host, and it is recorded here rather than
# hidden in a shell file nobody opens. Opt out by removing the line, or run
# `claude-code` as plain `claude`.
aliases:
  claude-code: claude --dangerously-skip-permissions
# settings.json is MERGED, never copied. The user's file is theirs: it can
# hold a proxy URL, a token, a model choice, hooks, and a permission mode
# that says the opposite of this key. Copying over it would silently undo
# all of that, and the failure is invisible until the agent stops working.
#
# The key is `skipDangerousModePermissionPrompt`, which is what makes the
# alias's --dangerously-skip-permissions flag usable without a prompt on
# every launch. It is written only when absent, so a user who has set it
# deliberately keeps their value. ACFS does the same merge with jq; the
# contract is the one that matters, not the tool.
#
# The file is resolved through any symlink before writing, because a
# dotfiles-managed symlink must be edited in place — replacing it with a
# regular file would orphan the user's dotfiles repo.
settings:
  - path: .claude/settings.json
    merge:
      skipDangerousModePermissionPrompt: true
tags:
  - ai
dependencies:
  - node
verify:
  command: claude
  version:
    command: claude --version
    min: "1.0"
install:
  darwin:
    strategy: npm
    npm_package: "@anthropic-ai/claude-code@2.1.283"
  linux:
    strategy: npm
    npm_package: "@anthropic-ai/claude-code@2.1.283"
