# AES catalog.
name: gemini
description: Google Gemini CLI
category: ai
tested: false
tags:
  - ai
dependencies:
  - node
  # npm is its own tool, not something node provides: `apt install nodejs`
  # installs node and NOT npm. Without this the install fails with
  # "strategy npm requires npm on PATH" — measured on a fresh container
  # during the full-catalog run.
  - npm
verify:
  command: gemini
  version:
    command: gemini --version
    min: "0.1.0"
install:
  darwin:
    strategy: npm
    npm_package: "@google/gemini-cli@0.61.0"
  linux:
    strategy: npm
    npm_package: "@google/gemini-cli@0.61.0"
