# AES catalog.
#
# NOT installable on Ubuntu 24.04 through this strategy, and the reason is
# measured rather than assumed. The npm package @google/gemini-cli declares
# `engines: {node: ">=20"}` and every version from 0.1.4 up fails at runtime on
# node 18.19.1 with a regex-v-flag SyntaxError — checked across 763 published
# versions; 0.1.1 is the newest that runs, and pinning it would ship a
# year-old CLI as if it were current.
#
# ACFS installs this one through bun rather than npm, which is why it works
# there. Adding a runtime to serve one tool is a different decision from
# listing the tool, so gemini is kept in the catalog as a declared
# requirement that a machine with node >= 20 can satisfy, and excluded from
# the default profile with the reason recorded there.
name: gemini
description: Google Gemini CLI
category: ai
# Both layers passed on the platform named below. Layer 1: a real machine
# running node 26, where gemini reports 0.44.1. Layer 2: a fresh ubuntu:24.04
# container running node 18.19.1, where the pinned 0.1.1 installs from the npm
# registry and reports 0.1.1. Both measured 2026-09-28 — see the linux target
# for why the version differs per platform.
tested: true
tested_on:
  - linux/arm64
  - linux/amd64
tags:
  - ai
dependencies:
  - node
  # npm is its own tool, not something node provides: `apt install nodejs`
  # installs node and NOT npm. Without this the install fails with
  # "strategy npm requires npm on PATH" — measured on a fresh container
  # during the full-catalog run.
  - npm
verify:
  command: gemini
  version:
    command: gemini --version
    min: "0.1.0"
install:
  darwin:
    strategy: npm
    npm_package: "@google/gemini-cli@0.61.0"
  linux:
    strategy: npm
    # 0.1.1, not 0.61.0. Measured across 763 published versions on a fresh
    # ubuntu:24.04 container running node 18.19.1: 0.1.1 is the only one that
    # runs, and everything from 0.1.3 up dies with a regex-v-flag SyntaxError.
    # The package declares engines node>=20, so npm installs it happily and
    # the binary then refuses to start — a runtime error the user cannot act
    # on, and the reason this pin exists rather than a floor.
    #
    # 0.1.1 is over a year old. That is the honest cost of this platform, and
    # it is the same trade beads and dcg had: a working tool beats a current
    # one, and the version is recorded here where the next author will see it.
    #
    # darwin keeps 0.61.0 because brew ships node 26, which satisfies the
    # engine. The two platforms genuinely need different versions, and one
    # coordinate cannot say that.
    npm_package: "@google/gemini-cli@0.1.1"
