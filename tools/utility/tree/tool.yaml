name: tree
description: print directory structure
category: utility
default: true
tested: true
tested_on:
- linux/arm64
- linux/amd64
- darwin/arm64
tags:
- utility
verify:
  command: tree
  version:
    command: tree --version
    min: '2.0'
install:
  darwin:
    strategy: package
    manager: brew
    package: tree
  linux:
    strategy: package
    manager: apt
    package: tree
