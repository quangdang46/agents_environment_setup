# AES catalog. github-release for darwin, linux at mikefarah/yq release v4.53.6;
# asset names and sha256 read from the upstream release by scripts/release_probe.py.
#
# `binary:` is per-arch and the names differ from the asset names by the .tar.gz
# suffix, because that is what is actually inside: the archives contain
# yq_linux_amd64, yq_darwin_arm64 and so on. There is no plain `yq` in any of
# them, so a single binary name would look for a file this release has never
# shipped. `verify.command` below is what a user types; `binary` is what gets
# installed, and those are different facts.
name: yq
description: command-line YAML processor
category: utility
tested: true
# Layer 1 and Layer 2 both passed on linux/amd64, 2026-09-30. What the
# flag means, and why there is no darwin/* entry, is in AGENTS.md under
# "tested: true".
tested_on:
  - linux/amd64
tags:
  - utility
verify:
  command: yq
  version:
    command: yq --version
    min: "4.0"
install:
  darwin:
    strategy: github-release
    release_tag: v4.53.6
    repository: mikefarah/yq
    binary:
      amd64: yq_darwin_amd64
      arm64: yq_darwin_arm64
    asset:
      amd64: yq_darwin_amd64.tar.gz
      arm64: yq_darwin_arm64.tar.gz
    sha256:
      amd64: cf8304676c6572960a3720a189fd42e7038bf989dc181f0c05019a2883caf540
      arm64: 4e2b18f4242c720965af7919dc0573819474cecf03a71b6cd7656025f2e5162c
  linux:
    strategy: github-release
    release_tag: v4.53.6
    repository: mikefarah/yq
    binary:
      amd64: yq_linux_amd64
      arm64: yq_linux_arm64
    asset:
      amd64: yq_linux_amd64.tar.gz
      arm64: yq_linux_arm64.tar.gz
    sha256:
      amd64: 38b907b21b1b04327fb9481c595331d925a67c6ee1aabd0ef419d0b7d12dfb3d
      arm64: d5e7531273d45c5d4b7abb4a1597c47a0fecb5d6b081dfa755064b38ffcc34f4
