name: ncdu
description: NCurses disk usage analyser
category: utility
default: true
tested: true
tested_on:
- linux/arm64
- linux/amd64
- darwin/arm64
tags:
- utility
verify:
  command: ncdu
  version:
    command: ncdu --version
    min: '1.18'
install:
  darwin:
    strategy: package
    manager: brew
    package: ncdu
  linux:
    strategy: package
    manager: apt
    package: ncdu
