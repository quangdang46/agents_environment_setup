name: direnv
description: per-directory environment loader
category: utility
tested: true
tested_on:
- linux/arm64
- linux/amd64
tags:
- utility
verify:
  command: direnv
  version:
    command: direnv version
    min: '2.30'
install:
  darwin:
    strategy: package
    manager: brew
    package: direnv
  linux:
    strategy: package
    manager: apt
    package: direnv
