# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: aadc
description: detects and adds agent definitions
category: utility
tested: false
tags:
  - utility
  - ai
verify:
  command: aadc
  version:
    command: aadc --version
    min: "0.1.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: aadc
  linux:
    strategy: package
    manager: apt
    package: aadc
