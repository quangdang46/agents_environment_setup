# AES catalog. github-release for darwin, linux at Dicklesworthstone/aadc release v0.1.1;
# asset names and sha256 read from the upstream release by scripts/release_probe.py.
#
# This was `package`/apt until an audit found the package name does not exist in
# Debian. The first check that said it did was reading an HTTP 200 from a page
# whose body said 'No such package' - a check that could not fail.
name: aadc
description: detects and adds agent definitions
category: utility
tested: false
tags:
  - utility
  - ai
verify:
  command: aadc
  version:
    command: aadc --version
    min: "0.1.0"
install:
  darwin:
    strategy: github-release
    repository: Dicklesworthstone/aadc
    asset:
      amd64: aadc-darwin-amd64.tar.xz
      arm64: aadc-darwin-arm64.tar.xz
    sha256:
      amd64: 40e29ca631f7e65b90d9300c71a8d9520b88acae07bb5913ee44c39139b4569b
      arm64: 70ac50d0dec48a17e9ab1aa4c296a13c53816149ce87b7e106e2de708652d3ef
  linux:
    strategy: github-release
    repository: Dicklesworthstone/aadc
    asset:
      amd64: aadc-linux-amd64.tar.xz
      arm64: aadc-linux-arm64.tar.xz
    sha256:
      amd64: 6d3f879deec1c8ff4af5da6d921726f51f758417991e709ce7e07261db420300
      arm64: 3658b0566f7f321a0bbc79bf3eaf46e9dc72f203582d13a9f50f03db59e044f0
