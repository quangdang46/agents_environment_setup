# AES catalog. Hex is local voice dictation (anomalyco/hex, MIT).
#
# The two platforms need different strategies, and neither is a preference:
#
#   darwin  brew cask, tap-qualified. `brew install hex` is NOT this tool:
#           homebrew/core carries an unrelated formula called `hex` (0.7.1),
#           and a bare name prints "Treating hex as a formula" and installs
#           that one — measured with `brew install --dry-run`, 2026-11-04.
#           `anomalyco/tap/hex` resolves to this project's cask.
#
#   linux   github-release. Upstream publishes a bare ELF per arch (no
#           archive, no tar), which the release installer detects from the
#           file's magic bytes and installs directly.
#
# Measured on 2026-11-04, darwin/arm64:
#
#   * Hex.app/Contents/MacOS/hex prints exactly `hex 3.3.0` and exits 0, and
#     `-v` is rejected ("unexpected argument '-v' found"), so the probe below
#     is the only spelling that works.
#   * The same bytes copied OUT of the bundle are SIGKILLed (exit 137). That
#     is why darwin is not a github-release target: the macOS release zip
#     (hex-3.3.0-macos-arm64.zip) contains only Hex.app, so extracting its
#     member would install a binary that cannot start.
#   * The cask's only artifact is `Hex.app (App)`: it installs
#     /Applications/Hex.app and puts NOTHING on PATH. So `verify.command: hex`
#     could never resolve after a successful install, and the darwin target
#     below declares a `links:` entry to fix that — a symlink in
#     $AES_HOME/bin pointing at the in-bundle binary. The link runs ("hex
#     3.3.0", exit 0); copying the bytes does not (exit 137).
#   * An earlier build of this manifest had no `links:` and reported
#     `tested: false` for exactly that reason. The link is the fix, so darwin
#     is declared proven; linux is NOT in `tested_on` because its install was
#     never run end to end here, and the flag is per platform (resolver skips
#     an unproven host rather than guessing).
name: hex
description: Local voice dictation for macOS, Windows and Linux
category: utility
default: false
tested: true
tested_on:
  - darwin/arm64
tags:
  - dictation
  - voice
  - transcription
provides:
  - hex
verify:
  command: hex
  version:
    command: hex --version
    min: "3.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: anomalyco/tap/hex
    # The cask installs an app bundle and no bin entry, so aes makes one.
    # /Applications/Hex.app is the cask's declared artifact path and is stable
    # across upgrades; the Caskroom copy is versioned and is not named here.
    #
    # This target is proven only on darwin/arm64, because the cask itself
    # `depends_on arch: :arm64`.
    links:
      hex: /Applications/Hex.app/Contents/MacOS/hex
  linux:
    strategy: github-release
    release_tag: v3.3.0
    repository: anomalyco/hex
    binary:
      amd64: hex
      arm64: hex
    asset:
      amd64: hex-3.3.0-linux-x64
      arm64: hex-3.3.0-linux-arm64
    sha256:
      # Both digests are of the bytes as published, fetched from the v3.3.0
      # release and hashed on 2026-11-04.
      amd64: e8c7b3a2ebeb1d7da5d6276d5f25145891d52178e3636347cb3ac331f7662622
      arm64: a8a28cb8bc922f8e11fd5996e090d88aa143a2c3a65b07f1962435d0b15a24d1
