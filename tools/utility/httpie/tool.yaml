name: httpie
description: user-friendly HTTP client
category: utility
tested: true
tested_on:
- linux/arm64
- linux/amd64
tags:
- utility
provides:
- http
verify:
  command: http
  version:
    command: http --version
    min: '3.0'
install:
  darwin:
    strategy: package
    manager: brew
    package: httpie
  linux:
    strategy: package
    manager: apt
    package: httpie
