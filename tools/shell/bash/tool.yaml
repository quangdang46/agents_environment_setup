name: bash
description: GNU Bourne Again shell
category: shell
tested: true
tested_on:
- linux/arm64
- linux/amd64
tags:
- shell
verify:
  command: bash
  version:
    command: bash --version
    min: '5.0'
install:
  darwin:
    strategy: package
    manager: brew
    package: bash
  linux:
    strategy: package
    manager: apt
    package: bash
