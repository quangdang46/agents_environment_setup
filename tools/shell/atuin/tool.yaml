# AES catalog. github-release for darwin, linux at atuinsh/atuin release v18.23.0; asset names and sha256 read from the upstream release by scripts/release_probe.py.
name: atuin
description: shell history with sync and search
category: shell
tested: false
tags:
  - shell
verify:
  command: atuin
  version:
    command: atuin --version
    min: "18.0"
install:
  darwin:
    strategy: github-release
    repository: atuinsh/atuin
    asset:
      # `atuin-`, not `atuin-server-`. The server is a different binary with a
      # different name; pointing at it installs a daemon and then fails to find
      # the client. Measured by downloading the release and listing the archive.
      amd64: atuin-x86_64-apple-darwin.tar.gz
      arm64: atuin-aarch64-apple-darwin.tar.gz
    sha256:
      amd64: f87ff4bef3f818f81474713dfc964008793a77ade12f8076f9a82237695a587a
      arm64: c988be1cde19cd7295ce64bc8b955d42fb1855e5227cb640c87fc09c8408c3fc
  linux:
    strategy: github-release
    repository: atuinsh/atuin
    asset:
      # `atuin-`, not `atuin-server-`. The server is a different binary; the
      # client is what ships as `atuin`. Measured by downloading the release
      # and listing the archive.
      amd64: atuin-x86_64-unknown-linux-gnu.tar.gz
      arm64: atuin-aarch64-unknown-linux-gnu.tar.gz
    sha256:
      amd64: 5cf46e926b696a9b23a3c61ef3cb00f8f7c156d1d7b7967a3b51741653b48ba3
      arm64: 21869faff1fedb9f8fb27837136567b089bcd588d21252533d5b314605517ae2
