name: zsh
description: Z shell
category: shell
tested: true
tested_on:
- linux/arm64
- linux/amd64
tags:
- shell
verify:
  command: zsh
  version:
    command: zsh --version
    min: '5.8'
install:
  darwin:
    strategy: package
    manager: brew
    package: zsh
  linux:
    strategy: package
    manager: apt
    package: zsh
