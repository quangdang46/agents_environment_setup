name: uv
description: fast Python package and project manager
category: runtime
tested: true
tested_on:
- linux/arm64
- linux/amd64
tags:
- runtime
verify:
  command: uv
  version:
    command: uv --version
    min: '0.4'
install:
  darwin:
    strategy: github-release
    release_tag: 0.12.20
    repository: astral-sh/uv
    asset:
      amd64: uv-x86_64-apple-darwin.tar.gz
      arm64: uv-aarch64-apple-darwin.tar.gz
    sha256:
      amd64: 6590717592ace991ff83a63fef799e3ad9d33ecc8f96c5d6bdd732496e79337f
      arm64: a9a8df1eedeb192f2e47e40e2faabfb387db4b850209118786d42f89dde3e0ba
  linux:
    strategy: github-release
    release_tag: 0.12.20
    repository: astral-sh/uv
    asset:
      amd64: uv-x86_64-unknown-linux-gnu.tar.gz
      arm64: uv-aarch64-unknown-linux-gnu.tar.gz
    sha256:
      amd64: 6590717592ace991ff83a63fef799e3ad9d33ecc8f96c5d6bdd732496e79337f
      arm64: 0804e9b164c64b6914182d5920c08551958a095986f10a3731056df701126436
