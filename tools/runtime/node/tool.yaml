# AES catalog. Package names verified against the homebrew formula index and the
# Debian package index.
#
# The floor is per-platform, and that is the whole point of this entry.
# A single number cannot describe two platforms: brew ships node 26.10.0,
# Ubuntu 24.04 (noble) ships nodejs 18.19.1 and nothing else. A 20.0 floor
# made `aes setup --only node` install correctly and then report it stale,
# exit 6, forever — and all four AI tools depend on node, so the entire npm
# set was uninstallable through aes on stock Ubuntu.
#
# The map says what each platform can actually supply. A tool whose floor is
# above what its platform offers is now reported as unavailable rather than
# stale, which is the distinction bead 8tv asked for.
name: node
description: Node.js JavaScript runtime
category: runtime
tested: false
tags:
  - runtime
provides:
  - node
  - npm
verify:
  command: node
  version:
    command: node --version
    min:
      darwin: "26.0"
      linux: "18.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: node
  linux:
    strategy: package
    manager: apt
    package: nodejs
