# AES catalog. Package names verified against the homebrew formula index and the
# Debian package index.
#
# The floor is per-platform, and that is the whole point of this entry.
# A single number cannot describe two platforms: brew ships node 26.10.0,
# Ubuntu 24.04 (noble) ships nodejs 18.19.1 and nothing else. A 20.0 floor
# made `aes setup --only node` install correctly and then report it stale,
# exit 6, forever — and all four AI tools depend on node, so the entire npm
# set was uninstallable through aes on stock Ubuntu.
#
# The map says what each platform can actually supply. A tool whose floor is
# above what its platform offers is now reported as unavailable rather than
# stale, which is the distinction bead 8tv asked for.
name: node
description: Node.js JavaScript runtime
category: runtime
# Both layers passed on the platform named below.
tested: true
tested_on:
  - linux/arm64
  # Layer 1: a real machine carrying node 26.2.0, verified against the darwin
  # floor is NOT what applies here — FloorFor(linux) reads 18.0, and 26.2.0
  # clears it. Layer 2: a fresh ubuntu:24.04 container with nothing but
  # ca-certificates, curl and git; `aes setup --only node` installed nodejs
  # from the distro index and `aes verify` reported StatusOK 18.19.1 with a
  # parsed version, npm 9.2.0 also present. Both measured 2026-09-28.
  - linux/amd64
tags:
  - runtime
# npm is NOT provided by this tool. On Ubuntu 24.04 `apt install nodejs`
# installs node and NOT npm — measured 2026-09-28 in a fresh container (node
# at /usr/bin/node, npm MISSING). npm is its own tool now, with its own
# install and its own verify; a tool that needs it declares the dependency.
# The reverse — preinstalling something an unrelated tool happens to use — is
# how a manifest accrues untestable side effects while looking convenient.
verify:
  command: node
  version:
    command: node --version
    min:
      darwin: "26.0"
      linux: "18.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: node
  linux:
    strategy: package
    manager: apt
    package: nodejs
