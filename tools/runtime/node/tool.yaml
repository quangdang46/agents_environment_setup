# AES catalog. Package names verified against the homebrew formula index and the
# Debian package index.
#
# The floor is 18, not 20, and it is a per-platform compromise forced by the
# schema: verify.version.min is a single number, but the platform supplies
# wildly different versions. Ubuntu 24.04 (noble) offers nodejs 18.19.1 and
# nothing else, so a 20.0 floor made aes setup --only node install correctly
# and then report it stale, exit 6, forever. All four AI tools depend on node,
# so the entire npm set was uninstallable through aes on stock Ubuntu.
#
# The floor now means "new enough to be worth installing on a platform that
# cannot supply more". That is weaker than a per-platform floor and it needs
# revisiting - tracked separately.
name: node
description: Node.js JavaScript runtime
category: runtime
tested: false
tags:
  - runtime
provides:
  - node
  - npm
verify:
  command: node
  version:
    command: node --version
    min: "18.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: node
  linux:
    strategy: package
    manager: apt
    package: nodejs
