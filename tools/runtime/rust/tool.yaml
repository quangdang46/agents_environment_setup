name: rust
description: Rust toolchain via rustc and cargo
category: runtime
tested: true
tested_on:
- linux/arm64
- linux/amd64
tags:
- runtime
provides:
- rustc
- cargo
verify:
  command: rustc
  version:
    command: rustc --version
    min: '1.20'
install:
  darwin:
    strategy: package
    manager: brew
    package: rust
  linux:
    strategy: package
    manager: apt
    package: cargo
