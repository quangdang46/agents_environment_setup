# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: go
description: the Go programming language
category: runtime
tested: true
# Layer 1 and Layer 2 both passed on linux/amd64, 2026-09-30. What the
# flag means, and why there is no darwin/* entry, is in AGENTS.md under
# "tested: true".
tested_on:
  - linux/amd64
tags:
  - runtime
verify:
  command: go
  version:
    command: go version
    min: "1.22"
install:
  darwin:
    strategy: package
    manager: brew
    package: go
  linux:
    strategy: package
    manager: apt
    package: golang-go
