# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: go
description: the Go programming language
category: runtime
tested: false
tags:
  - runtime
verify:
  command: go
  version:
    command: go version
    min: "1.22"
install:
  darwin:
    strategy: package
    manager: brew
    package: go
  linux:
    strategy: package
    manager: apt
    package: golang-go
