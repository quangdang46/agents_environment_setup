# AES catalog. github-release for darwin, linux at BurntSushi/ripgrep release 15.2.0; asset names and sha256 read from the upstream release by scripts/release_probe.py.
name: ripgrep
description: recursive line-oriented search, respects .gitignore
category: search
tested: false
tags:
  - search
  - text
provides:
  - rg
verify:
  command: rg
  version:
    command: rg --version
    min: "13.0"
install:
  darwin:
    strategy: github-release
    repository: BurntSushi/ripgrep
    asset:
      amd64: ripgrep-15.2.0-x86_64-apple-darwin.tar.gz
      arm64: ripgrep-15.2.0-aarch64-apple-darwin.tar.gz
    sha256:
