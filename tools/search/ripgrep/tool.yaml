# AES catalog. github-release for darwin, linux at BurntSushi/ripgrep release 15.2.0; asset names and sha256 read from the upstream release by scripts/release_probe.py.
name: ripgrep
description: recursive line-oriented search, respects .gitignore
category: search
# Both layers passed on the platform named below: aes installed this from
# nothing in a fresh container, and `aes verify` reported StatusOK with a
# parsed version on that same machine afterwards (bead gj9). `tested_on`
# is load-bearing rather than decorative — require_tested reads it, so the
# resolver skips this on a host it was never proven on.
tested: true
tested_on:
  - linux/arm64
  # Layer 2: a fresh ubuntu:24.04 container with only ca-certificates, curl and
  # git present; `aes setup` installed this from nothing and `aes verify`
  # reported StatusOK with a parsed version on that machine. Measured
  # 2026-09-28 during the full-catalog run.
  - linux/amd64
tags:
  - search
  - text
provides:
  - rg
verify:
  command: rg
  version:
    command: rg --version
    min: "13.0"
install:
  darwin:
    strategy: github-release
    release_tag: 15.2.0
    repository: BurntSushi/ripgrep
    # The release archive ships the binary as `rg`. Without this the installer
    # looks for a file called `ripgrep`, does not find it, and fails the install
    # with "archive does not contain the expected binary" — while the verifier
    # in the same manifest is quite correctly looking for `rg`.
    binary:
      amd64: rg
      arm64: rg
    asset:
      amd64: ripgrep-15.2.0-x86_64-apple-darwin.tar.gz
      arm64: ripgrep-15.2.0-aarch64-apple-darwin.tar.gz
    sha256:
      amd64: af7825fcc69a2afc7a7aea55fc9af90e26421d8f20fe59df32e233c0b8a231c1
      arm64: 3750b2e93f37e0c692657da574d7019a101c0084da05a790c83fd335bad973e4
  linux:
    strategy: github-release
    release_tag: 15.2.0
    repository: BurntSushi/ripgrep
    binary:
      amd64: rg
      arm64: rg
    asset:
      amd64: ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
      arm64: ripgrep-15.2.0-aarch64-unknown-linux-gnu.tar.gz
    sha256:
      amd64: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
      arm64: a740b91c82eaf9914cfedd353572f2791cbe0162c84101ee0951058f4dcbc90d
