# AES catalog. cargo crate ast-grep, pinned at the newest non-yanked version
# from the crates.io sparse index on 2026-09-28. The archive ships a binary
# called `sg` rather than `ast-grep`, so the manifest names it explicitly —
# inferring the name from the tool is how yq ended up unrunnable.
name: ast-grep
description: structural search and replace for code
category: search
tested: false
tags:
  - search
dependencies:
  - rust
verify:
  command: sg
  version:
    command: sg --version
    min: "0.40"
install:
  darwin:
    strategy: cargo
    cargo_name: ast-grep@0.45.3
  linux:
    strategy: cargo
    cargo_name: ast-grep@0.45.3
