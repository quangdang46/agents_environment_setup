# AES catalog. github-release at ast-grep/ast-grep 0.45.3. Asset names and
# sha256 verified by downloading every artifact and hashing it on this host
# (2026-09-28); the archive carries both `sg` and `ast-grep`.
#
# Two decisions in this file are deliberate:
#
# 1. github-release, not cargo. The crate pins nothing old enough to build on
#    Ubuntu 24.04's rustc 1.75.0: 0.45.3 needs rustc 1.88, and every older
#    version back through 0.20.0 needs edition2024 or a dependency that
#    needs rustc 1.77. ACFS installs it with `cargo install --locked`,
#    which works on a machine with a fresh rustup and fails on this one.
#    A prebuilt binary does not care what rustc the machine has.
#
# 2. The binary is `ast-grep`, not `sg`. The archive ships both, but `sg`
#    prints a deprecation warning and reports a DIFFERENT version than the
#    release it came from (0.43.0 inside the 0.45.3 archive). Verifying `sg`
#    would assert a number the manifest did not choose.
name: ast-grep
description: structural search and replace for code
category: search
tested: false
tags:
  - search
verify:
  command: ast-grep
  version:
    command: ast-grep --version
    min: "0.40"
install:
  darwin:
    strategy: github-release
    repository: ast-grep/ast-grep
    asset:
      amd64: app-x86_64-apple-darwin.zip
      arm64: app-aarch64-apple-darwin.zip
    sha256:
      amd64: b2ffd26f42810340326a9e8a084bdc3647a8795c1a3f21fc06bd7bef3c7c5b2c
      arm64: 6d2279dea5bea2ad79c66ea93f5fe54ba926e398a8a26de76c56db68fe59eac6
  linux:
    strategy: github-release
    repository: ast-grep/ast-grep
    asset:
      amd64: app-x86_64-unknown-linux-gnu.zip
      arm64: app-aarch64-unknown-linux-gnu.zip
    sha256:
      amd64: f8ac830881339d1edee6b2652f54798c0f4da5a827f2db38a08ee31117783ce8
      arm64: b39cfbc58da4b869a88b8a4bc57bd5deb0d24541e704cf7c257da7b53ec81c8f
