# AES catalog. github-release for darwin, linux at junegunn/fzf release v0.74.4; asset names and sha256 read from the upstream release by scripts/release_probe.py.
name: fzf
description: general-purpose command-line fuzzy finder
category: search
# Both layers passed on the platform named below: aes installed this from
# nothing in a fresh container, and `aes verify` reported StatusOK with a
# parsed version on that same machine afterwards (bead gj9). `tested_on`
# is load-bearing rather than decorative — require_tested reads it, so the
# resolver skips this on a host it was never proven on.
tested: true
tested_on:
  - linux/arm64
  # Layer 2: a fresh ubuntu:24.04 container with only ca-certificates, curl and
  # git present; `aes setup` installed this from nothing and `aes verify`
  # reported StatusOK with a parsed version on that machine. Measured
  # 2026-09-28 during the full-catalog run.
  - linux/amd64
tags:
  - search
verify:
  command: fzf
  version:
    command: fzf --version
    min: "0.50"
install:
  darwin:
    strategy: github-release
    repository: junegunn/fzf
    asset:
      amd64: fzf-0.74.4-darwin_amd64.tar.gz
      arm64: fzf-0.74.4-darwin_arm64.tar.gz
    sha256:
      amd64: 2d392b50be66e2ab104ccd52a6072df692b1f9b9c5b449a9c098de885f32c4c5
      arm64: 4f6a113bfc0c7959e0005c78d566a51afc4fcefc956f43735c62a9deb19e92ae
  linux:
    strategy: github-release
    repository: junegunn/fzf
    asset:
      amd64: fzf-0.74.4-linux_amd64.tar.gz
      arm64: fzf-0.74.4-linux_arm64.tar.gz
    sha256:
      amd64: 05e6813a337cc722c3ed07e54a764b75cc5d671e2e60459db0ba696ee5fa7504
      arm64: 5d673b849f494f0d64ec471d8640b153ca8849e3846a31da17abdcfce8df6b46
