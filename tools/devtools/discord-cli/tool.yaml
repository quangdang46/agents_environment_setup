name: discord-cli
description: Discord CLI and MCP server running as your own user account
category: agent
default: true
tested: true
tested_on:
  # Proven on darwin/arm64, 2026-10-22, in both layers.
  #
  # Layer 1: the tool was on the machine, and the probe read a version
  # above the floor.
  #
  # Layer 2: the full sequence on a machine where the tool was ABSENT —
  # install, verify, state written, re-run changes nothing, the binary
  # deleted is noticed as drift, and --force puts it back. Run by the
  # host Layer 2 proof, whose PATH did not carry the developer's own
  # copy of the tool: a machine that already has the tool cannot prove
  # a fresh install of it.
  - darwin/arm64
  # Proven on linux/arm64, 2026-10-22, in the container sweep: a fresh
  # ubuntu:24.04 per tool, the full seven-step sequence (install, verify,
  # state, idempotent re-run, drift detected, --force reinstalls, present
  # after). 49.61s, no sequence failure.
tags:
  - agent
verify:
  command: discord
  version:
    command: discord --version
    min: "0.1.2"
install:
  darwin:
    strategy: github-release
    release_tag: v0.1.2
    repository: quangdang46/discord_cli
    binary:
      amd64: discord
      arm64: discord
    asset:
      amd64: discord-macos-x86_64.tar.gz
      arm64: discord-macos-aarch64.tar.gz
    sha256:
      amd64: d4fb78f4d36a0276f8752871df66affc835a5fe736a4b2cae5681a9a086c38f7
      arm64: 9f4561a3d6fb739e1ad876e7403baeca159e4ba7979cf11065d40c41f5a2f30c
  linux:
    strategy: github-release
    release_tag: v0.1.2
    repository: quangdang46/discord_cli
    binary:
      amd64: discord
      arm64: discord
    asset:
      amd64: discord-linux-x86_64.tar.gz
      arm64: discord-linux-aarch64.tar.gz
    sha256:
      amd64: 3ad49bcb10eb5aaa2c08c1863ff21ba1d753d80ef10c4698df47e8edd6893b1b
      arm64: ea67584a8c3c9cf6201d9f4e6ba5729fa2732bef3eef918b02091055a23d62ad
