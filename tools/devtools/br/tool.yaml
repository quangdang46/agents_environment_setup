name: br
description: beads_rust task manager for AI coding agents
category: agent
default: true
tested: true
tested_on:
  # Proven on darwin/arm64, 2026-10-22, in both layers.
  #
  # Layer 1: the tool was on the machine, and the probe read a version
  # above the floor.
  #
  # Layer 2: the full sequence on a machine where the tool was ABSENT —
  # install, verify, state written, re-run changes nothing, the binary
  # deleted is noticed as drift, and --force puts it back. Run by the
  # host Layer 2 proof, whose PATH did not carry the developer's own
  # copy of the tool: a machine that already has the tool cannot prove
  # a fresh install of it.
  - darwin/arm64
tags:
  - agent
verify:
  command: br
  version:
    command: br --version
    min: "0.2.0"
install:
  darwin:
    strategy: github-release
    release_tag: v0.2.0
    repository: quangdang46/beads_rust
    binary:
      amd64: br
      arm64: br
    asset:
      amd64: br-macos-x64.tar.gz
      arm64: br-macos-arm64.tar.gz
    sha256:
      amd64: 02bfff637bfe49ade735f4b007ad1741e76fad5b47f57083218fbb08489b09e9
      arm64: 4eb17a608c253e32eb940e62ec3e6d48fc1a9f388aa790d350559fb4ef99c16c
  linux:
    strategy: github-release
    release_tag: v0.2.0
    repository: quangdang46/beads_rust
    binary:
      amd64: br
      arm64: br
    asset:
      amd64: br-linux-x64.tar.gz
      arm64: br-linux-arm64.tar.gz
    sha256:
      amd64: 952b82f260aa6f6010c06903054ac52b40dc081a92af1007baf332afe183c5dd
      arm64: fd2b37adf4e7b30c3b7ab7c453431365f0357a9f3e61bcd8421ad73ce6b7be8c
