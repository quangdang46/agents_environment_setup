name: hashline
description: content-hash addressed file editing for AI coding assistants
category: agent
default: true
tested: true
tested_on:
  # Proven on darwin/arm64, 2026-10-22, in both layers.
  #
  # Layer 1: the tool was on the machine, and the probe read a version
  # above the floor.
  #
  # Layer 2: the full sequence on a machine where the tool was ABSENT —
  # install, verify, state written, re-run changes nothing, the binary
  # deleted is noticed as drift, and --force puts it back. Run by the
  # host Layer 2 proof, whose PATH did not carry the developer's own
  # copy of the tool: a machine that already has the tool cannot prove
  # a fresh install of it.
  - darwin/arm64
  # NOT provable on linux/arm64, measured 2026-10-22, and the measurement is
  # the evidence: the release publishes no linux/arm64 asset at v0.9.19
  # (linux-x86_64, macos-x64, macos-aarch64 and windows-x64 only), so the
  # manifest's linux target deliberately carries no arm64 asset entry. The
  # product refuses correctly on that arch, in two layers:
  #
  #   aes setup --only hashline
  #     -> "no tool in this selection can be installed on linux/arm64;
  #         proven only on darwin/arm64, not on this host"
  #
  #   aes setup --only hashline --allow-unproven
  #     -> "no asset for this architecture: install hashline has no asset
  #         for arm64 (declared: amd64)", exit 6, in 0.0s
  #
  # The refusal is the proof that the absence is declared rather than
  # missing: a tool that silently installed the wrong arch would be the bug.
  # The linux/amd64 coordinate stays unproven until an amd64 container run
  # proves it (see the bead for that proof).
tags:
  - agent
verify:
  command: hashline
  version:
    command: hashline --version
    min: "0.9.19"
install:
  darwin:
    strategy: github-release
    release_tag: v0.9.19
    repository: quangdang46/hashline
    binary:
      amd64: hashline
      arm64: hashline
    asset:
      amd64: hashline-v0.9.19-macos-x86_64.tar.gz
      arm64: hashline-v0.9.19-macos-aarch64.tar.gz
    sha256:
      amd64: 7f62741e4440ba82909d59530fb127c0bd13364eb0f101028bda42b9255e272b
      arm64: 5dcd47df402449f8cef662ccfd4f826ae2cd429a990279182a5cfefd984d307a
  linux:
    # NO linux/arm64 ASSET EXISTS at v0.9.19. The release ships only
    # linux-x86_64, macos-x64, macos-aarch64 and windows-zip, and the
    # find-missing-arch rule makes the manifest's absence deliberate rather
    # than an oversight: on arm64 aes reports the tool as unsupported here,
    # which is the honest answer to "which platforms can this run on".
    strategy: github-release
    release_tag: v0.9.19
    repository: quangdang46/hashline
    binary:
      amd64: hashline
    asset:
      amd64: hashline-v0.9.19-linux-x86_64.tar.gz
    sha256:
      amd64: f708e373f49fb6096ca659656d19153d88264c014399ef8677a8a0ede5b14c31
