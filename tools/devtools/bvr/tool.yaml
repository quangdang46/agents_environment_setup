name: bvr
description: graph-aware triage engine for Beads projects (beads_graph)
category: agent
default: true
tested: true
tested_on:
  # Proven on darwin/arm64, 2026-10-22, in both layers.
  #
  # Layer 1: the tool was on the machine, and the probe read a version
  # above the floor.
  #
  # Layer 2: the full sequence on a machine where the tool was ABSENT —
  # install, verify, state written, re-run changes nothing, the binary
  # deleted is noticed as drift, and --force puts it back. Run by the
  # host Layer 2 proof, whose PATH did not carry the developer's own
  # copy of the tool: a machine that already has the tool cannot prove
  # a fresh install of it.
  - darwin/arm64
tags:
  - agent
verify:
  # `bvr` is the binary the release actually ships, on every platform.
  #
  # This used to say `bv`, and the comment above it explained why: the
  # release shipped a file called `bv` then, and the tool name stayed `bvr`
  # to match the repository. The release moved on — v0.25.2 ships `bvr` in
  # both its linux and its macos archive (measured 2026-10-22) — and the
  # manifest's `binary:` map was updated with it, but the verify command was
  # not.
  #
  # The leftover was not harmless. The name the release ships is the name
  # the installer extracts, and the verify command is the name it is
  # installed AS, so the two together decide what `aes verify bvr` looks
  # for. On a machine with the current release installed, that is `bvr` —
  # and asking for `bv` instead finds a stale leftover from an older
  # release: measured on the developer's machine, `bv` was 0.16.4 while
  # `bvr` was 0.25.2, so `aes verify bvr` reported the tool as stale on a
  # machine carrying the version the manifest pins.
  #
  # The program still calls itself `bv` in its own --version output
  # ("bv v0.25.2"), which is what made the old name look right. The file
  # the release ships is `bvr`, and the file is what lands on PATH.
  command: bvr
  version:
    command: bvr --version
    min: "0.25.2"
install:
  darwin:
    strategy: github-release
    release_tag: v0.25.2
    repository: quangdang46/beads_graph
    binary:
      amd64: bvr
      arm64: bvr
    asset:
      amd64: bvr-v0.25.2-macos-x86_64.tar.gz
      arm64: bvr-v0.25.2-macos-aarch64.tar.gz
    sha256:
      amd64: 1e53463677a9ea822d1f172d99f689acd69facaa64fbb31ff6a4514be0e5d8e5
      arm64: d2ad13add901d7ba3f1af5218659446273ba7dafa4a07720898eb1672a09a4f0
  linux:
    strategy: github-release
    release_tag: v0.25.2
    repository: quangdang46/beads_graph
    binary:
      amd64: bvr
      arm64: bvr
    asset:
      amd64: bvr-v0.25.2-linux-x86_64.tar.gz
      arm64: bvr-v0.25.2-linux-aarch64.tar.gz
    sha256:
      amd64: 1631dba8cae77607ff1ec75d923a4496b21466daddb90dd5f64bddddf1a58ebc
      arm64: 6eb3397c6350167fcb7aa4ead9f7c2781fe52e6cb9c981385e60687c4291cfbd
