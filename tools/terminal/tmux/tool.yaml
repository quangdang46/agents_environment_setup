# AES catalog. Package names verified against the homebrew formula index and the Debian package index.
name: tmux
description: terminal multiplexer
category: terminal
# Both layers passed on the platform named below: aes installed this from
# nothing in a fresh container, and `aes verify` reported StatusOK with a
# parsed version on that same machine afterwards (bead gj9). `tested_on`
# is load-bearing rather than decorative — require_tested reads it, so the
# resolver skips this on a host it was never proven on.
tested: true
tested_on:
  - linux/arm64
  # Proven on amd64 by the same sequence, on 2026-09-27: installed from
  # nothing in a fresh ubuntu:24.04 container, `tmux -V` reports 3.4. See the
  # claude entry for why the proof run needs --allow-unproven.
  - linux/amd64
tags:
  - terminal
verify:
  command: tmux
  version:
    command: tmux -V
    min: "3.0"
install:
  darwin:
    strategy: package
    manager: brew
    package: tmux
  linux:
    strategy: package
    manager: apt
    package: tmux
