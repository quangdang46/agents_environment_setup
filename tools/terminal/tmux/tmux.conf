# AES-managed tmux configuration.
#
# This file is installed by `aes setup` into ~/.aes/config/tmux/tmux.conf and
# activated as ~/.tmux.conf when — and only when — that path does not already
# exist. An existing ~/.tmux.conf is the user's and is never overwritten.
#
# It is deliberately small. A multiplexer config that fights the user's
# muscle memory is worse than none, so this sets the three things that cost
# the most to discover and leaves everything else at the default.

# Prefix: C-a instead of C-b. The default reaches for the backspace key
# alongside the escape sequence a shell is already using, and C-a is the one
# binding every screen user already has.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# History: the default 2000 lines is not enough to scroll back through a
# long agent run and find where it started drifting.
set -g history-limit 50000

# Mouse: pane and window selection by click, and scrolling to move through
# the history. Both are on because tmux disables them by default and the
# default is worse than either alternative.
set -g mouse on
