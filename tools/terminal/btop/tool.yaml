# AES catalog. github-release for linux at aristocratos/btop release v1.4.7; asset names and sha256 read from the upstream release by scripts/release_probe.py. Package names verified against the homebrew formula index and the Debian package index.
name: btop
description: resource monitor that pretends to be fancy
category: terminal
tested: true
tested_on:
  # Proven on linux/amd64 on 2026-09-27: installed from nothing in a fresh
  # ubuntu:24.04 container and `aes verify` reported StatusOK with a parsed
  # version (btop 1.4.7) on that machine afterwards (bead gj9).
  - linux/amd64
tags:
  - terminal
verify:
  command: btop
  version:
    command: btop --version
    min: "1.2"
install:
  darwin:
    strategy: package
    manager: brew
    package: btop
  linux:
    strategy: github-release
    release_tag: v1.4.7
    repository: aristocratos/btop
    asset:
      amd64: btop-x86_64-unknown-linux-musl.tar.gz
      arm64: btop-aarch64-unknown-linux-musl.tar.gz
    sha256:
      amd64: 5099054dd6a101bd12eb6ff3702a9a6a3f57aaa27923a0da478ae5b517faf335
      arm64: 6270de0ef4c84cf0eea61cb148b3ad9ae91a11e9c3309867ffc6b3751024c252
