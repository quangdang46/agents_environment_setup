# AES catalog. github-release for darwin, linux at  release ; asset names and sha256 read from the upstream release by scripts/release_probe.py.
name: dust
description: du replacement for people who can read
category: terminal
tested: true
tested_on:
  # Proven on linux/amd64 on 2026-09-27: installed from nothing in a fresh
  # ubuntu:24.04 container and `aes verify` reported StatusOK with a parsed
  # version (dust 1.2.6) on that machine afterwards (bead gj9).
  - linux/amd64
tags:
  - terminal
  - disk
verify:
  command: dust
  version:
    command: dust --version
    min: "1.0"
install:
  darwin:
    strategy: github-release
    release_tag: v1.2.6
    repository: bootandy/dust
    asset:
      amd64: dust-v1.2.6-x86_64-apple-darwin.tar.gz
      arm64: dust-v1.2.6-aarch64-apple-darwin.tar.gz
    sha256:
      amd64: 7603c92462bd56305847732eb25d70ab06386d7bcfbce7532b7cf3937fd9684f
      arm64: 5c37ee0d353165c73aedd6b21b9133182221efe08f9a5e76c082d9d6d5a0935d
  linux:
    strategy: github-release
    release_tag: v1.2.6
    repository: bootandy/dust
    asset:
      amd64: dust-v1.2.6-x86_64-unknown-linux-gnu.tar.gz
      arm64: dust-v1.2.6-aarch64-unknown-linux-gnu.tar.gz
    sha256:
      amd64: 14f788707aad217667f6812cf1a9639bf5c861a2ee815d486cffc36051f5e759
      arm64: ec6a63bc275a33000443d444fd5424e56745aa995bc88e1080cd951e5e9e5cbf
