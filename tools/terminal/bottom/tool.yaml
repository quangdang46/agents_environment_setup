# AES catalog. github-release for darwin, linux at ClementTsang/bottom release 0.14.9; asset names and sha256 read from the upstream release by scripts/release_probe.py.
name: bottom
description: graphical process monitor
category: terminal
tested: true
tested_on:
  # Proven on linux/amd64 on 2026-09-28: installed from nothing in a
  # fresh ubuntu:24.04 container (Layer 2) and verified on a machine carrying
  # it on PATH (Layer 1). The Layer 1 half needs the AES env sourced, because
  # these install under ~/.aes/bin — which is where aes puts everything it
  # owns, and what `aes env --write` exists to put on PATH (bead gj9).
  - linux/amd64
tags:
  - terminal
# Upstream ships the binary as `btm` on every platform. The installer's
# fallback is the tool name, so without `binary:` below it looks for a file
# called `bottom`, does not find one, and fails with "archive does not contain
# the expected binary" — while the verifier, reading `command:` here, would look
# for the same missing name. Both have to change together; that they are two
# fields is the `c4481e6` shape again, and `binary` exists to break it.
verify:
  command: btm
  version:
    command: btm --version
    min: "0.9"
install:
  darwin:
    strategy: github-release
    release_tag: 0.14.9
    repository: ClementTsang/bottom
    binary:
      amd64: btm
      arm64: btm
    asset:
      amd64: bottom_x86_64-apple-darwin.tar.gz
      arm64: bottom_aarch64-apple-darwin.tar.gz
    sha256:
      amd64: d0b1d446963ee3c4dfbfe2efd9614cfdc77f39e8268bf8cc2e0b5b6cea982774
      arm64: 28358e19a3d62b3778fc0d1778b0028a682059145c9ac38ac5076bf124d77714
  linux:
    strategy: github-release
    release_tag: 0.14.9
    repository: ClementTsang/bottom
    binary:
      amd64: btm
      arm64: btm
    asset:
      amd64: bottom_x86_64-unknown-linux-gnu-2-17.tar.gz
      arm64: bottom_aarch64-unknown-linux-gnu.tar.gz
    sha256:
      amd64: 15774bae02e251e652f438a07a309ffbcb1b4e5fb60a21031608155009b3bba7
      arm64: a6a0a0dda426b31b2c72e15a26c7e97c2224aafdd66f60632e34ee464a64ec8f
